<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案C 縦の年表</title>
<!-- S-012 スマホの見せ方の案 C（見本。まだ本物の図には入れない）。
     参考：スマホは縦にスクロールするのが基本なので、図を横に広げず縦に積む（Chunky Chains 2026 https://arxiv.org/abs/2607.06029 ）、
     つながりを線ではなく「近い順の列」で見せる GraphTiles（NCSU 2013 https://techrep.csc.ncsu.edu/2013/TR-2013-6.pdf ）
     ・図を横に回して縦の年表に：下へスクロールすると時代が進む。技術はアイコンの大きなマス（1行に4つ）で名前つき
     ・線は描かない。1つ押すと、前提のマスが茶色・次の技術のマスが青に光り、下のカードに出る（カードは小さく、図を隠さない） -->
<link rel="stylesheet" href="../design.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); padding-bottom: 96px; }
.tag { text-align: center; background: #c0392b; color: #fff; font-size: 12px; padding: 2px 10px; }
header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); }
header .r { display: flex; gap: 8px; padding: 8px 10px 4px; }
header input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font: inherit; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 10px 8px; font-size: 12px; }
.chips span { flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--bg); }
.chips span.on { border-color: var(--accent); color: var(--accent); }
.era { position: sticky; top: 84px; z-index: 5; background: var(--bg); font-size: 13px; font-weight: 700; padding: 6px 12px; border-bottom: 1px solid var(--line); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px 10px; }
.t { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 6px 2px; border: 2px solid transparent; border-radius: 12px; background: var(--panel); font-size: 11px; line-height: 1.25; color: var(--ink); text-decoration: none; min-height: 72px; }
.t img { width: 32px; height: 32px; image-rendering: pixelated; }
.t span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.t.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
.t.par { border-color: #b9855a; }
.t.kid { border-color: #4a90c2; }
.t.dim { opacity: .35; }
.card { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 20; display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.15); font-size: 13px; }
.card img { width: 40px; height: 40px; image-rendering: pixelated; }
.card b { display: block; font-size: 15px; }
.card a { margin-left: auto; flex: none; padding: 8px 10px; border: 1px solid var(--accent); border-radius: 10px; color: var(--accent); text-decoration: none; font-weight: 700; }
.lg { font-size: 11px; color: var(--sub); }
.lg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin: 0 2px 0 6px; }
</style>
</head>
<body>
<div class="tag">案C：縦の年表（見本）</div>
<header><div class="r"><button class="btn">☰</button><input placeholder="さがす（名前・番号）"></div>
  <div class="chips"><span class="on">ぜんぶ</span><span>モノ</span><span>半導体</span><span>電気</span><span>化学</span><span>金属</span><span>光</span><span>通信</span></div></header>
<div id="page"></div>
<div class="card" id="card"></div>
<script src="../tech_network_graph.js"></script>
<script>
const G = window.TECH_GRAPH, byId = new Map(G.nodes.map(n => [n.id, n]));
const E = G.edges.map(([from, to, kind]) => ({ from, to, kind }));
const ERAS = [[-1e9, 1700, '大昔〜1700年'], [1700, 1850, '1700〜1850年'], [1850, 1900, '1850〜1900年'], [1900, 1940, '1900〜1940年'], [1940, 1960, '1940〜1960年'], [1960, 1980, '1960〜1980年'], [1980, 2000, '1980〜2000年'], [2000, 1e9, '2000年〜']];
const nodes = G.nodes.filter(n => n.year != null && n.kind !== 'idea').sort((a, b) => a.year - b.year);
const page = document.getElementById('page');
page.innerHTML = ERAS.map(([a, b, h]) => { const ns = nodes.filter(n => n.year >= a && n.year < b);
  return `<div class="era">${h}<span class="lg">（${ns.length}）</span></div><div class="grid">${ns.map(n => `<a class="t" data-id="${n.id}" href="#${n.id}">${n.icon ? `<img src="${n.icon}" alt="">` : n.symbol}<span>${n.name}</span></a>`).join('')}</div>`; }).join('');
function pick(id, jump) {
  const par = new Set(E.filter(e => e.to === id).map(e => e.from)), kid = new Set(E.filter(e => e.from === id).map(e => e.to));
  page.querySelectorAll('.t').forEach(t => { const i = t.dataset.id; t.className = 't' + (i === id ? ' sel' : par.has(i) ? ' par' : kid.has(i) ? ' kid' : ' dim'); });
  const d = byId.get(id);
  document.getElementById('card').innerHTML = `${d.icon ? `<img src="${d.icon}" alt="">` : ''}<div><b>${d.name}</b>${d.year_range || d.year}年<div class="lg"><i style="background:#b9855a"></i>前提 ${par.size}<i style="background:#4a90c2"></i>次 ${kid.size}</div></div><a href="../node.html#${id}">詳しく</a>`;
  if (jump) { const el = page.querySelector(`.t[data-id="${id}"]`); if (el) el.scrollIntoView({ block: 'center' }); }
}
page.addEventListener('click', e => { const t = e.target.closest('.t'); if (t) { e.preventDefault(); pick(t.dataset.id); } });
pick(location.hash.slice(1) || '9-23', true);
</script>
</body>
</html>
