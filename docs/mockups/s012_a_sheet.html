<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案A 地図と下の引き出し</title>
<!-- S-012 スマホの見せ方の案 A（見本。まだ本物の図には入れない）。
     参考：地図アプリの「下の引き出し」（Material Design：引き出しを出したまま地図を動かせる https://m1.material.io/components/bottom-sheets.html ）
     ・丸を大きく（指で押せる 44px）、名前は重ならない分だけ出す（つながる物・大事な物を先に）
     ・選んだ技術のカードは下の引き出し。半分だけ出し、図を隠さないよう、選んだ丸は引き出しより上へ動かす -->
<link rel="stylesheet" href="../design.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
.tag { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 30; background: #c0392b; color: #fff; font-size: 12px; padding: 2px 10px; border-radius: 999px; }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; gap: 8px; padding: 30px 10px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
header .btn { flex: none; }
header input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font: inherit; }
#map { position: absolute; inset: 0; touch-action: none; overflow: hidden; }
.yr { position: absolute; font-size: 11px; color: var(--sub); border-left: 1px dashed var(--line); padding-left: 3px; height: 100%; top: 0; }
.nd { color: var(--ink); text-decoration: none; position: absolute; width: 96px; margin-left: -48px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; }
.nd .c { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 3px solid #b9855a; }
.nd.done .c { border-width: 4px; }
.nd.sel .c { box-shadow: 0 0 0 4px var(--accent); }
.nd.rel .c { border-color: var(--accent); }
.nd img { width: 28px; height: 28px; image-rendering: pixelated; }
.nd b { position: relative; z-index: 2; font-size: 12px; font-weight: 400; line-height: 1.25; background: color-mix(in srgb, var(--bg) 85%, transparent); border-radius: 4px; padding: 0 2px; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: 38%; background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.12); padding: 6px 16px 16px; }
.sheet .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 8px; }
.sheet h2 { font-size: 18px; margin: 0; display: flex; gap: 8px; align-items: center; }
.sheet h2 img { width: 32px; height: 32px; image-rendering: pixelated; }
.sheet .meta { color: var(--sub); font-size: 13px; }
.sheet .row { display: flex; gap: 8px; margin-top: 10px; }
.sheet .row a { flex: 1; text-align: center; padding: 10px 0; border: 1px solid var(--accent); border-radius: 10px; color: var(--accent); text-decoration: none; font-weight: 700; font-size: 14px; }
.note { position: fixed; right: 8px; bottom: calc(38% + 8px); z-index: 15; font-size: 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; color: var(--sub); }
</style>
</head>
<body>
<div class="tag">案A：地図と下の引き出し（見本）</div>
<header><button class="btn">☰</button><input placeholder="さがす（名前・番号）"></header>
<div id="map"></div>
<div class="note">ピンチで拡大・縮小。名前は重ならない分だけ出る</div>
<div class="sheet" id="sheet"></div>
<script src="../tech_network_graph.js"></script>
<script>
const G = window.TECH_GRAPH, T = G.layout.time, byId = new Map(G.nodes.map(n => [n.id, n]));
G.edges = G.edges.map(([from, to, kind]) => ({ from, to, kind }));
const map = document.getElementById('map'), S = 3;   // 今の図より約3倍に拡大した状態（丸が指で押せる大きさ・重なりが少ない）
let sel = (location.hash.slice(1) || '9-23');
function draw() {
  const me = T[sel], W = innerWidth, H = innerHeight, cx = W / 2, cy = (H * 0.62) / 2 + 40;
  const pos = id => [cx + (T[id][0] - me[0]) * S, cy + (T[id][1] - me[1]) * S];
  const rel = new Set(G.edges.filter(e => e.from === sel || e.to === sel).map(e => e.from === sel ? e.to : e.from));
  let html = '', lines = '';
  for (const e of G.edges) if ((e.from === sel || e.to === sel) && T[e.from] && T[e.to]) {
    const [x1, y1] = pos(e.from), [x2, y2] = pos(e.to);
    lines += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--accent)" stroke-width="2" opacity=".6"/>`;
  }
  // 名前の重なりを避ける：選んだ物・つながる物・子孫の多い物から順に置き、ほかの名前とぶつかる名前は出さない（丸だけ）
  const order = G.nodes.filter(n => T[n.id]).sort((a, b) => (b.id === sel) - (a.id === sel) || rel.has(b.id) - rel.has(a.id) || b.descendants - a.descendants);
  const boxes = [];
  for (const n of order) {
    const [x, y] = pos(n.id); if (x < -30 || x > W + 30 || y < 90 || y > H * 0.62 + 40) continue;
    const bx = [x - 48, y + 24, x + 48, y + 40], free = !boxes.some(b => b[0] < bx[2] && bx[0] < b[2] && b[1] < bx[3] && bx[1] < b[3]);
    if (free) boxes.push(bx);
    html += `<a class="nd ${n.status === '✅' ? 'done' : ''} ${n.id === sel ? 'sel' : ''} ${rel.has(n.id) ? 'rel' : ''}" style="left:${x}px;top:${y - 22}px" href="#${n.id}" onclick="sel='${n.id}';draw();return false"><span class="c">${n.icon ? `<img src="${n.icon}" alt="">` : n.symbol}</span>${free ? `<b>${n.name}</b>` : ''}</a>`;
  }
  map.innerHTML = `<svg width="${W}" height="${H}">${lines}</svg>` + html;
  const d = byId.get(sel), np = G.edges.filter(e => e.to === sel && e.kind === 'r').length, nk = G.edges.filter(e => e.from === sel && e.kind === 'r').length;
  document.getElementById('sheet').innerHTML = `<div class="grip"></div><h2>${d.icon ? `<img src="${d.icon}" alt="">` : ''}[${d.id}] ${d.name}</h2>
    <div class="meta">${d.year_range || d.year}年・${d.trunk_name}・${d.status === '✅' ? '✅ ゲームにある' : 'まだ'}</div>
    <div class="meta" style="margin-top:6px">前提 ${np}・次の技術 ${nk}（線でつないで表示）</div>
    <div class="row"><a href="../node.html#${d.id}">詳しく見る</a><a href="#">前提をたどる</a></div>
    <div class="meta" style="margin-top:8px">↑ 引き出しを上に引くと、へえ・人物が出る（図は上に残る）</div>`;
}
draw();
</script>
</body>
</html>
