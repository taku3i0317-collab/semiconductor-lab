<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案B 近所の図</title>
<!-- S-012 スマホの見せ方の案 B（見本。まだ本物の図には入れない）。
     参考：Obsidian の「ローカルグラフ」（今のノートにつながる物だけを出し、深さを選ぶ https://obsidian.md/help/plugins/graph ）、
     スマホでは全体を先に見せにくいので「1つを中心に、となりへ進む」見せ方（JGAA 2012 https://jgaa.info/index.php/jgaa/article/view/paper252 ）
     ・スマホでは全体の図の代わりに、選んだ技術を真ん中に、前提を上・次の技術を下に大きなボタンで並べる。押すとそこが真ん中になる
     ・全体の図は「全体の地図」ボタンで今までの図へ。上の帯で「今どの時代か」が分かる -->
<link rel="stylesheet" href="../design.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); padding-bottom: 70px; }
.tag { text-align: center; background: #c0392b; color: #fff; font-size: 12px; padding: 2px 10px; }
header { position: sticky; top: 0; z-index: 10; display: flex; gap: 8px; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
header input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font: inherit; }
.time { position: relative; height: 34px; margin: 8px 12px 0; border-radius: 8px; background: linear-gradient(90deg, #e8dcc6, #d9e6ef); font-size: 10px; color: var(--sub); }
.time span { position: absolute; top: 18px; transform: translateX(-50%); }
.time i { position: absolute; top: 2px; width: 3px; height: 16px; background: var(--accent); border-radius: 2px; }
.time i.p { background: #b9855a; opacity: .7; height: 10px; top: 5px; }
h3 { font-size: 13px; color: var(--sub); margin: 14px 12px 6px; font-weight: 400; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 12px; }
.tile { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); text-decoration: none; font-size: 13px; line-height: 1.3; }
.tile img { width: 32px; height: 32px; image-rendering: pixelated; flex: none; }
.tile small { display: block; color: var(--sub); font-size: 11px; }
.tile.done { border-color: var(--ok, #2e8b57); }
.me { margin: 6px 12px; padding: 12px; border: 2px solid var(--accent); border-radius: 16px; background: var(--panel); display: flex; gap: 12px; align-items: center; }
.me img { width: 64px; height: 64px; image-rendering: pixelated; }
.me b { font-size: 18px; display: block; }
.arrow { text-align: center; color: var(--accent); font-size: 18px; line-height: 1; margin: 4px 0; }
.more { margin: 6px 12px; font-size: 12px; color: var(--sub); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--line); }
.bar a { flex: 1; text-align: center; padding: 10px 0; border: 1px solid var(--accent); border-radius: 10px; color: var(--accent); text-decoration: none; font-weight: 700; font-size: 14px; }
</style>
</head>
<body>
<div class="tag">案B：近所の図（見本）</div>
<header><button class="btn">☰</button><input placeholder="さがす（名前・番号）"></header>
<div id="page"></div>
<div class="bar"><a href="#">全体の地図</a><a id="det" href="#">詳しく見る</a></div>
<script src="../tech_network_graph.js"></script>
<script>
const G = window.TECH_GRAPH, byId = new Map(G.nodes.map(n => [n.id, n]));
const E = G.edges.map(([from, to, kind]) => ({ from, to, kind }));
const yx = y => { const [a, b] = G.layout.xs; let i = a.findIndex(v => v > y); if (i < 1) i = a.length - 1; return (b[i - 1] + (b[i] - b[i - 1]) * (y - a[i - 1]) / (a[i] - a[i - 1])) / b[b.length - 1] * 100; };
const tile = id => { const n = byId.get(id); return `<a class="tile ${n.status === '✅' ? 'done' : ''}" href="#${id}">${n.icon ? `<img src="${n.icon}" alt="">` : n.symbol}<span>${n.name}<small>${n.year ?? ''}${n.year ? '年' : ''}</small></span></a>`; };
function draw() {
  const id = location.hash.slice(1) || '9-23', d = byId.get(id);
  const par = [...new Set(E.filter(e => e.to === id && 'rep'.includes(e.kind)).map(e => e.from))].filter(i => byId.has(i));
  const kid = [...new Set(E.filter(e => e.from === id && 'rep'.includes(e.kind)).map(e => e.to))].filter(i => byId.has(i));
  const marks = [1800, 1900, 1950, 2000].map(y => `<span style="left:${yx(y)}%">${y}</span>`).join('');
  document.getElementById('page').innerHTML = `
    <div class="time">${marks}${par.map(i => byId.get(i).year != null ? `<i class="p" style="left:${yx(byId.get(i).year)}%"></i>` : '').join('')}${d.year != null ? `<i style="left:${yx(d.year)}%"></i>` : ''}</div>
    <h3>▲ これを作るのに要った物（前提 ${par.length}）</h3>
    <div class="grid">${par.slice(0, 6).map(tile).join('') || '<span class="more">なし（ここが出発点）</span>'}</div>
    ${par.length > 6 ? `<div class="more">ほか ${par.length - 6} … もっと見る</div>` : ''}
    <div class="arrow">↓</div>
    <div class="me">${d.icon ? `<img src="${d.icon}" alt="">` : d.symbol}<div><b>[${d.id}] ${d.name}</b><span class="meta" style="color:var(--sub);font-size:13px">${d.year_range || d.year || ''}年・${d.trunk_name}<br>${d.status === '✅' ? '✅ ゲームにある' : 'まだ'}・この先に ${d.descendants} の技術</span></div></div>
    <div class="arrow">↓</div>
    <h3>▼ これで作れるようになった物（次の技術 ${kid.length}）</h3>
    <div class="grid">${kid.slice(0, 8).map(tile).join('') || '<span class="more">なし</span>'}</div>
    ${kid.length > 8 ? `<div class="more">ほか ${kid.length - 8} … もっと見る</div>` : ''}`;
  document.getElementById('det').href = '../node.html#' + id;
  scrollTo(0, 0);
}
addEventListener('hashchange', draw); draw();
</script>
</body>
</html>
