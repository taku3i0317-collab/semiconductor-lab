<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>たどった道 見本</title>
<!-- S-041 見本（本番には入れていない。ユーザーの OK 待ち）：中心図の上に「たどった道のアイコンの列」。
     ?trail=B-10,P-16,...（URL で同じ道が開く）。丸を2回押して真ん中を変えると列が伸びる。
     列のアイコンを押すとそこへ戻る、← ・スマホの戻る・画面の左の端から右へのスワイプ＝1つ戻る、最初のアイコンを長押し＝最初にもどる。
     道は「前提の道」：› の下の「要る」＝右の物は左の物を作るのに要る。図の中では、今の真ん中から列の1つ前のアイコンへ細い光の線 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=DotGothic16&display=swap">
<link rel="stylesheet" href="../design.css">
<style>
.crumbs { position: fixed; z-index: 10001; left: 0; right: 0; top: 100px; height: 44px; display: flex; align-items: center; gap: 2px; padding: 0 12px; overflow-x: auto; scrollbar-width: none; background: color-mix(in srgb, var(--bg, #faf7f0) 88%, transparent); border-block: 1px solid var(--line, #ddd); }
.crumbs::-webkit-scrollbar { display: none; }
.crumbs .back { position: sticky; left: 0; z-index: 1; box-shadow: -12px 0 0 var(--bg, #faf7f0); flex: none; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--accent, #2f6f8f); background: var(--panel, #fff); color: var(--accent, #2f6f8f); font-size: 20px; font-weight: 700; cursor: pointer; margin-right: 6px; }
.crumbs .back:disabled { opacity: .35; cursor: default; }
.crumbs .c { flex: none; display: flex; align-items: center; gap: 4px; border: 0; background: none; padding: 2px 4px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 12px; color: var(--sub, #666); max-width: 92px; }
.crumbs .c img { width: 24px; height: 24px; image-rendering: pixelated; flex: none; }
.crumbs .c span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs .c.now { color: var(--ink, #222); font-weight: 700; max-width: 150px; background: color-mix(in srgb, #e8a33d 22%, transparent); }
.crumbs .c.now img { width: 32px; height: 32px; }
.crumbs .sep { flex: none; color: var(--sub, #888); font-size: 12px; line-height: 1; text-align: center; }
.crumbs .sep small { display: block; font-size: 9px; }
.crumbs .gap { flex: none; border: 1px dashed var(--line, #ccc); background: none; border-radius: 8px; padding: 2px 8px; cursor: pointer; color: var(--sub, #666); font: inherit; }
#trailLine { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 10000; pointer-events: none; }
@media (min-width: 900px) { .crumbs { right: auto; max-width: 60vw; border: 1px solid var(--line, #ddd); border-left: 0; border-radius: 0 12px 12px 0; } }
</style>
</head>
<body>
<script>window.FILM_BASE = '../'; window.FILM_LAYOUT = 'height';</script>
<script src="../tech_network_graph.js"></script>
<script src="../film.js"></script>
<svg id="trailLine"><line id="tl" stroke="#e8a33d" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round" opacity=".9"/></svg>
<script>
(function () {
  const byId = new Map(TECH_GRAPH.nodes.map(n => [n.id, n]));
  const q = new URLSearchParams(location.search);
  let trail = (q.get('trail') || '').split(',').filter(k => byId.has(k));
  if (!trail.length) { try { trail = (localStorage.getItem('tn-trail-last') || '').split(',').filter(k => byId.has(k)); } catch (e) { /* 保存できない */ } }
  if (!trail.length) trail = ['B-10'];
  let expanded = false;
  const bar = document.createElement('nav'); bar.className = 'crumbs'; bar.setAttribute('aria-label', 'たどった道');
  const save = () => {
    history.replaceState(history.state, '', '?trail=' + trail.join(','));
    try { localStorage.setItem('tn-trail-last', trail.join(',')); } catch (e) { /* 保存できない */ }
  };
  const goTo = i => { if (i === trail.length - 1) return; trail = trail.slice(0, i + 1); ctl.center(trail[i]); render(); };
  const back = () => { if (trail.length > 1) goTo(trail.length - 2); };
  function render() {
    save();
    const item = (k, i) => {
      const n = byId.get(k), now = i === trail.length - 1;
      return `<button type="button" class="c${now ? ' now' : ''}" data-i="${i}" title="${n.name}${i === 0 ? '（長押しで最初にもどる）' : ''}"${now ? ' aria-current="page"' : ''}>${n.icon ? `<img src="${n.icon}" alt="">` : ''}<span>${n.name}</span></button>`;
    };
    const sep = '<span class="sep" aria-label="これを作るのに要る">›<small>要る</small></span>';
    let idx = trail.map((k, i) => i);
    if (trail.length > 6 && !expanded) idx = [0, -1, ...idx.slice(-4)];   // 6個を超えたら最初と最後の4個、間は「…」（押すと全部）
    bar.innerHTML = `<button type="button" class="back" aria-label="1つ戻る"${trail.length > 1 ? '' : ' disabled'}>←</button>` +
      idx.map(i => i < 0 ? `<button type="button" class="gap" aria-label="全部見る">…${trail.length - 5}</button>` : item(trail[i], i)).join(sep);
    bar.scrollLeft = bar.scrollWidth;
  }
  bar.addEventListener('click', e => {
    if (e.target.closest('.back')) return back();
    if (e.target.closest('.gap')) { expanded = true; return render(); }
    const c = e.target.closest('.c'); if (!c) return;
    if (c.dataset.long) { delete c.dataset.long; return; }
    goTo(+c.dataset.i);
  });
  let lp = 0;   // 最初のアイコンの長押し＝最初にもどる
  bar.addEventListener('pointerdown', e => { const c = e.target.closest('.c'); if (c && c.dataset.i === '0') lp = setTimeout(() => { c.dataset.long = '1'; goTo(0); }, 600); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => bar.addEventListener(t, () => clearTimeout(lp)));
  // 画面の左の端から右へスワイプ＝1つ戻る
  let sx = null;
  addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX < 24 ? [t.clientX, t.clientY] : null; }, { passive: true });
  addEventListener('touchend', e => { const t = e.changedTouches[0]; if (sx && t.clientX - sx[0] > 70 && Math.abs(t.clientY - sx[1]) < 60) back(); sx = null; }, { passive: true });
  // スマホ・ブラウザの戻る＝1つ戻る（道が1つだけのときは、ふつうに前のページへ）
  history.pushState({ trail: 1 }, '', location.href);
  addEventListener('popstate', () => { if (trail.length > 1) { back(); history.pushState({ trail: 1 }, '', location.href); } else history.back(); });
  const ctl = Film.center(trail[trail.length - 1], { base: '../', onCenter: k => { if (k !== trail[trail.length - 1]) { trail.push(k); render(); } }, onClose: () => { location.href = '../network.html'; } });
  document.body.appendChild(bar);
  const place = () => { const lg = document.querySelector('.film .flegend'); if (lg) bar.style.top = `${Math.round(lg.getBoundingClientRect().bottom + 6)}px`; };   // 凡例のすぐ下（凡例が2行になっても隠さない）
  place(); addEventListener('resize', place);
  window.TRAIL_GO = k => { ctl.center(k); trail.push(k); render(); };   // 写真を撮る用
  // 図の中の光の線：今の真ん中から、列の1つ前のアイコンへ（来た道が上の列へ続いている）
  const tl = document.getElementById('tl');
  (function loop() {
    const now = bar.querySelector('.c.now'), prev = now && now.previousElementSibling && now.previousElementSibling.previousElementSibling;
    if (prev && prev.classList.contains('c') && ctl.view && ctl.view.sc) {
      const r = prev.getBoundingClientRect(), v = ctl.view;
      tl.setAttribute('x1', v.cx); tl.setAttribute('y1', v.cy); tl.setAttribute('x2', r.left + r.width / 2); tl.setAttribute('y2', r.bottom); tl.style.display = '';
    } else tl.style.display = 'none';
    requestAnimationFrame(loop);
  })();
  render();
})();
</script>
</body>
</html>
