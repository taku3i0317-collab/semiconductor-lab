<title>ほどける泡 見本</title>
<!-- S-049 見本（本番には入れていない）：分野の泡（S-048）を、切り替えボタンでなく拡大の度合いで自然に変える（意味で変わる拡大）。
     泡ごとに、画面の上で中の丸の間が広くなったら泡がほどけて丸が出る → もっと広げると名前 → 線。泡を押すとその泡へ寄ってほどける。
     ?id=番号（はじめはスマホ B-10）。数は全部データから。くわしい文（へえ）は後から読む -->

<script>

  const q = new URLSearchParams(location.search);
  let id = byId.has(q.get('id')) ? q.get('id') : 'B-10', hist = [], S, groups, P = new Map(), sel = null, W = 0, H = 0, dpr = 1;
  const groupOf = k => { const n = byId.get(k); return n.kind === 'idea' ? 'I' : ['P', 'B'].includes(n.trunk) ? 'P' : n.trunk; };

    groups = [...m].map(([g, ks]) => {

      ks.sort((a, b) => (byId.get(b).pr || 0) - (byId.get(a).pr || 0));   // 大事な物が泡のまん中

  // 世界の大きさは 1000 × 1000 前後（画面に合わせて全体を入れる倍率が「縮めた時」）

  // ---- カメラ（拡大と移動） ----

    const z = cam.z, open = groups.map(x => sm(13, 22, x.d * z)), named = groups.map(x => x.d * z), hue = i => Math.round(i / groups.length * 360);

    const [cx, cy] = toScr([0, 0]);
    groups.forEach((x, i) => {
      const [bx, by] = toScr([x.x, x.y]), nd = x.ks.filter(k => S.direct.has(k)).length;
      if (nd) { ctx.globalAlpha = 0.55 * (1 - open[i] * 0.7); ctx.strokeStyle = '#c9861e'; ctx.lineWidth = 1 + Math.log2(1 + nd); ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(bx, by); ctx.stroke(); }
    });
    // 中の丸どうしの線：広げた泡の中だけ（さらに広げた時）。選んだ物の線は濃く、泡をまたいでも
    ctx.lineWidth = 1;
    for (const [f, t] of S.links) {
      const gf = S.gOf.get(f), gt = S.gOf.get(t), hot = sel && (f === sel || t === sel);
      let a = 0;
      if (hot) a = 0.85; else if (gf != null && gf === gt) a = 0.25 * sm(30, 46, named[gf]);
      if (a < 0.02) continue;
      const [x1, y1] = toScr(P.get(f)), [x2, y2] = toScr(P.get(t));
      ctx.globalAlpha = a; ctx.strokeStyle = hot ? '#e8a33d' : '#8a8278'; ctx.lineWidth = hot ? 2 : 1; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    // 泡と中の丸
    const labels = [];
    groups.forEach((x, i) => {
      const [bx, by] = toScr([x.x, x.y]), br = x.r * z, o = open[i];

      ctx.globalAlpha = 1; ctx.fillStyle = `hsl(${hue(i)} 60% ${94 + o * 3}%)`; ctx.strokeStyle = `hsl(${hue(i)} 45% 45%)`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1 - o * 0.6; ctx.stroke();
      // ほどける前：いちばん大事な物の絵と数
      if (o < 1) {
        ctx.globalAlpha = 1 - o; const is = Math.min(br * 1.1, 64), im = img(x.ks[0]);
        if (im) { ctx.imageSmoothingEnabled = false; ctx.drawImage(im, bx - is / 2, by - is / 2 - (br > 30 ? is * 0.15 : 0), is, is); }
        if (br > 30) { ctx.fillStyle = `hsl(${hue(i)} 45% 30%)`; ctx.font = '700 12px "BIZ UDPGothic",sans-serif'; ctx.textAlign = 'center'; ctx.fillText(x.ks.length, bx, by + is * 0.5 + 8); }
        if (x.nO) { ctx.fillStyle = '#3f8f4f'; ctx.beginPath(); ctx.arc(bx + br * 0.72, by - br * 0.72, 9, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = '700 11px "BIZ UDPGothic",sans-serif'; ctx.textAlign = 'center'; ctx.fillText(x.nO, bx + br * 0.72, by - br * 0.72 + 4); }
      }

      ctx.globalAlpha = 1; ctx.font = '700 12px "BIZ UDPGothic",sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = BG; ctx.fillStyle = '#2b2622';
      const lt = x.name + (br <= 30 ? ' ' + x.ks.length : ''), ly = o > 0.5 ? by - br - 6 : by + br + 14; ctx.strokeText(lt, bx, ly); ctx.fillText(lt, bx, ly);

        for (const k of x.ks) {

          ctx.globalAlpha = o; ctx.fillStyle = '#fffdf8'; ctx.strokeStyle = k === sel ? '#e8a33d' : S.rootSet.has(k) ? '#3f8f4f' : `hsl(${hue(i)} 45% 45%)`; ctx.lineWidth = k === sel ? 3 : 1.5;
          const r = k === sel ? nr * 1.3 : nr;

          const im = r >= 7 && img(k); if (im) { ctx.imageSmoothingEnabled = false; ctx.drawImage(im, px - r * 0.72, py - r * 0.72, r * 1.44, r * 1.44); }
          if (named[i] >= 34 || k === sel) labels.push([px, py + r + 12, nm(byId.get(k)), (byId.get(k).pr || 0) + (k === sel ? 1e3 : 0), o * sm(34, 44, named[i]) || 1]);
        }

    const ci = img(id); if (ci) { ctx.imageSmoothingEnabled = false; ctx.drawImage(ci, cx - cr * 0.7, cy - cr * 0.7, cr * 1.4, cr * 1.4); }

    ctx.font = '700 12px "BIZ UDPGothic",sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = BG;   // 名前のふちは地の色
    for (const [x, y, t, , a] of labels) { let w = 0; for (const ch of t) w += ch.codePointAt(0) > 0x2e80 ? 12 : 7; const b = [x - w / 2, y - 11, x + w / 2, y + 3]; if (boxes.some(o => o[0] < b[2] && b[0] < o[2] && o[1] < b[3] && b[1] < o[3])) continue; boxes.push(b); ctx.globalAlpha = a; ctx.strokeText(t, x, y); ctx.fillStyle = '#2b2622'; ctx.fillText(t, x, y); }

  // ---- 押す・広げる・動かす ----
  const ptrs = new Map(); let moved = 0, pinch = null;
  cv.addEventListener('pointerdown', e => { try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 取れなくても続ける */ } ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; anim = null; if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: cam.z, w: toWorld((a[0] + b[0]) / 2 - cv.getBoundingClientRect().left, (a[1] + b[1]) / 2 - cv.getBoundingClientRect().top) }; } });

  cv.addEventListener('keydown', e => { const k = e.key; if (k === '+' || k === '=') cam.z *= 1.25; else if (k === '-') cam.z = Math.max(fitZ * 0.8, cam.z / 1.25); else if (k === '0') cam = fit(); else if (k.startsWith('Arrow')) { const s = 60 / cam.z; if (k === 'ArrowLeft') cam.x -= s; if (k === 'ArrowRight') cam.x += s; if (k === 'ArrowUp') cam.y -= s; if (k === 'ArrowDown') cam.y += s; } else return; e.preventDefault(); req(); });
  fitB.onclick = () => fly(fit());
  // ---- シート：選んだ物のへえと、真ん中までの道 ----
  function openNode(k) {
    const n = byId.get(k), path = [k]; let u = k; while (S.via.has(u) && u !== id) { u = S.via.get(u); path.push(u); }
    const chain = path.reverse();
    document.getElementById('shT').textContent = nm(n);
    const body = hee => `<div class="big">${n.icon ? `<img src="${n.icon}" alt="">` : ''}<div><h3>${esc(nm(n))}</h3><div class="yr">${yr(n.year)}${S.rootSet.has(k) ? `<span class="chip">${T.origin}</span>` : ''}</div></div></div>
      <p class="hee">${esc(hee)}</p><div class="yr">${T.path}</div>
      <div class="path">${chain.map(c => `<span class="n">${byId.get(c).icon ? `<img src="${byId.get(c).icon}" alt="">` : ''}${esc(nm(byId.get(c)))}</span>`).join('<span class="ar">←</span>')}</div>
      <div class="acts"><button type="button" class="ib" data-c="${k}">${T.center}</button>${Film.countOf(k, 'down') ? `<button type="button" class="ib" data-w="${k}">${T.watch}</button>` : ''}<a class="ib" href="../node.html#${k}">${T.more}</a></div>`;
    shB.innerHTML = body('…');
    loadDetail().then(() => { if (sel !== k) return; const d = D[k] || {}; shB.innerHTML = body(((EN && d.hee1_en) || d.hee1 || '').replace(/（[^（）]*出典[:：][^）]*）/g, '')); furi(); });
    const was = sheet.hidden; sheet.hidden = false; document.body.classList.add('sheetOn'); if (was && innerWidth >= 900) resize(); furi();
  }
  const furi = () => { if (window.Furigana && window.FURI_DICT) Furigana.apply(sheet); };
  function hideSheet() { const was = !sheet.hidden; sheet.hidden = true; document.body.classList.remove('sheetOn'); if (was && innerWidth >= 900) resize(); }
  document.getElementById('shX').onclick = () => { sel = null; hideSheet(); req(); };
  shB.addEventListener('click', e => { const c = e.target.closest('[data-c]'); if (c) return go(c.dataset.c); const w = e.target.closest('[data-w]'); if (w) Film.play(w.dataset.w, { base: '../' }); });
  function go(k, push = true) { if (k === id) return; if (push) hist.push(id); id = k; sel = null; hideSheet(); history.replaceState(null, '', '?id=' + k); build(); cam = fit(); req(); }
  document.getElementById('back').onclick = () => { if (hist.length) go(hist.pop(), false); };
  document.getElementById('lang').textContent = EN ? '日本語' : 'EN';
  document.getElementById('lang').onclick = () => { try { localStorage.setItem('tn-lang', EN ? 'ja' : 'en'); } catch (e) { /* 保存できない */ } location.reload(); };
  addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) { sel = null; hideSheet(); req(); } });
  function resize() { const r = cv.getBoundingClientRect(); W = r.width; H = r.height; dpr = Math.min(2, devicePixelRatio || 1); cv.width = W * dpr; cv.height = H * dpr; const f = fitZ; fit(); if (cam.z === f || !cam.z) cam = fit(); req(); }
  addEventListener('resize', resize);
  build(); resize(); cam = fit(); frame();
  cv.setAttribute('aria-label', document.getElementById('sum').textContent);
  window.S049 = { set: (z, x = 0, y = 0) => { cam = { x, y, z: fitZ * z }; req(); }, sel: k => { sel = k; openNode(k); req(); }, groups: () => groups, ready: performance.now() };   // 写真を撮る用
  setTimeout(loadDetail, 400);
  const fb = document.getElementById('furi');
  fb.addEventListener('click', e => { if (window.FURI_DICT) return; e.stopImmediatePropagation(); const s = document.createElement('script'); s.src = '../furigana_dict.js'; s.onload = () => fb.click(); document.head.appendChild(s); }, true);
})();
</script>
<script src="../furigana.js"></script>
<script>
(function () { let on = false; try { on = localStorage.getItem('tn-furi') === '1'; } catch (e) { /* 保存できない */ }
  const init = () => Furigana.init(document.getElementById('furi'));
  if (on) { const s = document.createElement('script'); s.src = '../furigana_dict.js'; s.onload = init; document.head.appendChild(s); } else init(); })();
</script>
