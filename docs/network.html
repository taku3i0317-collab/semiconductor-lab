<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技術ネットワーク</title>
<!-- データ：tools/gen_tree_views.py が書き出す tech_network.js（＝tech_network.json と同じ中身）。実行すれば図も最新になる。
     アイコン・モノの絵文字・人物は docs/network_meta.json、どれがモノかは TECH_TREE.md の「種類: モノ」 -->
<style>
:root {
  --bg: #f7f6f2; --panel: #ffffff; --ink: #1f2328; --sub: #5b6470; --line: #d9d6cc; --band-a: #efede6; --band-b: #f7f6f2;
  --accent: #2f6fdd; --dim: 0.12; --hl: #ff9f1c; --prod: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --panel: #1e2127; --ink: #e8e6e1; --sub: #a0a7b2; --line: #343842; --band-a: #1b1e23; --band-b: #15171b;
    --accent: #7aa7ff; --hl: #ffb347; --prod: #262a31;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --panel: #1e2127; --ink: #e8e6e1; --sub: #a0a7b2; --line: #343842; --band-a: #1b1e23; --band-b: #15171b;
  --accent: #7aa7ff; --hl: #ffb347; --prod: #262a31;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0 8px 0 0; white-space: nowrap; }
header .stat { color: var(--sub); font-size: 12px; }
header input[type=search], header select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); min-width: 0; }
header input[type=search] { width: 220px; max-width: 100%; }
header label { display: inline-flex; gap: 4px; align-items: center; color: var(--sub); white-space: nowrap; cursor: pointer; }
main { flex: 1; position: relative; overflow: hidden; display: flex; min-height: 0; }
#chart { flex: 1; min-width: 0; position: relative; }
svg#svg { width: 100%; height: 100%; display: block; touch-action: none; }
.band-label { font-size: 11px; font-weight: 600; }
.era-label { font-size: 10px; fill: var(--sub); }
.era-line { stroke: var(--line); stroke-dasharray: 2 4; }
.edge { fill: none; stroke-width: 0.9; }
.edge.hot { stroke-width: 1.8; }
.edge.understanding { stroke-dasharray: 3 3; }
.plink { fill: none; stroke: var(--sub); stroke-width: 1.4; stroke-opacity: 0.35; }
.node { cursor: pointer; }
.node .shape { stroke-width: 1.6; }
.node image { image-rendering: pixelated; pointer-events: none; }
.node .sym { pointer-events: none; text-anchor: middle; dominant-baseline: central; }
.node .lab { font-size: 9px; fill: var(--ink); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
.node.product .shape, .node.idea .shape { stroke-width: 2.4; fill: var(--prod); }
.node.product .lab, .node.idea .lab { font-size: 11px; font-weight: 700; text-anchor: middle; }
.node.idea .shape { stroke-width: 2; }
.edge.enables { stroke-dasharray: 7 3; }
.dimmed { opacity: var(--dim); }
.hidden { display: none; }
.node.match .shape { stroke: var(--hl); stroke-width: 3; }
.node.selected .shape { stroke: var(--hl); stroke-width: 4; }
.node.lit .shape { stroke: var(--hl); }
aside#card { width: 340px; max-width: 100%; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px 16px; display: none; }
aside#card.open { display: block; }
#card h2 { font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
#card h2 img { width: 32px; height: 32px; image-rendering: pixelated; }
#card h2 .em { font-size: 28px; }
#card .meta { color: var(--sub); font-size: 12px; margin-bottom: 8px; }
#card .sec { margin: 10px 0; }
#card .sec h3 { font-size: 12px; color: var(--sub); margin: 0 0 4px; font-weight: 600; }
#card .chips { display: flex; flex-wrap: wrap; gap: 4px; }
#card .chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 12px; cursor: pointer; background: var(--bg); color: var(--ink); }
#card .chip:hover { border-color: var(--accent); }
#card .close { float: right; border: 0; background: none; color: var(--sub); font-size: 18px; cursor: pointer; }
#card .big { font-size: 22px; font-weight: 700; color: var(--accent); }
#card .people { display: flex; flex-wrap: wrap; gap: 8px; }
.portrait { width: 48px; height: 48px; image-rendering: pixelated; flex: none; }
#card .person { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px 6px 6px; background: var(--bg); }
#card .person svg { flex: none; }
#card .person b { display: block; font-size: 13px; }
#card .person small { color: var(--sub); }
.legend { position: absolute; left: 12px; bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 11px; color: var(--sub); display: flex; gap: 12px; flex-wrap: wrap; max-width: calc(100% - 24px); }
.legend span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.band-tech.faint { opacity: 0.3; }
.band-zoom { font-size: 13px; fill: var(--sub); }
#card .more { display: inline-block; margin-top: 6px; border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 3px 10px; text-decoration: none; font-size: 13px; }
.hint { position: absolute; right: 12px; top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--sub); }
/* 人の壁（NET-04） */
#card details.wall summary { cursor: pointer; font-size: 13px; }
#card details.wall summary b { color: var(--accent); font-size: 18px; }
#card .wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; margin-top: 6px; max-height: 360px; overflow: auto; }
#card .wtile { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1px; padding: 4px 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); cursor: pointer; font: inherit; }
#card .wtile:hover { border-color: var(--accent); }
#card .wtile img, #card .wtile svg { width: 40px; height: 40px; image-rendering: pixelated; }
#card .wtile b { font-size: 11px; line-height: 1.25; }
#card .wtile small { font-size: 10px; color: var(--sub); line-height: 1.25; }
.sw { display: inline-block; width: 18px; height: 3px; border-radius: 2px; }
@media (max-width: 700px) {
  aside#card { position: absolute; left: 0; right: 0; bottom: 0; width: auto; max-height: 50vh; border-left: 0; border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(0,0,0,.15); z-index: 5; }
  /* スマホ：見出しの高さを詰めて図を広く（タイトルと検索を1行、切り替えを小さく） */
  header { padding: 8px 12px; gap: 6px 10px; }
  header h1 { font-size: 15px; margin: 0; }
  header input[type=search] { width: auto; flex: 1 1 160px; }
  header select { flex: 1 1 40%; }
  header label { font-size: 12px; }
  header .stat { font-size: 11px; width: 100%; }
  .legend { display: none; }
  .hint { top: auto; bottom: 10px; right: 10px; left: 10px; text-align: center; }
}
</style>
</head>
<body>
<header>
  <h1>技術ネットワーク</h1>
  <input type="search" id="q" placeholder="検索（名前・番号・本物・へえ）" aria-label="検索">
  <select id="trunk" aria-label="幹で絞り込み"><option value="">すべての幹</option></select>
  <select id="layout" aria-label="表示の形"><option value="time">時間軸</option><option value="net">ネットワーク</option></select>
  <label><input type="checkbox" id="all"> すべての技術</label>
  <label><input type="checkbox" id="now"> 今すぐ作れるだけ</label>
  <label><input type="checkbox" id="und" checked> 理解の線</label>
  <span class="stat" id="stat"></span>
</header>
<main>
  <div id="chart">
    <svg id="svg" role="img" aria-label="技術ネットワーク図"></svg>
    <div class="hint" id="hint"></div>
    <div class="legend">
      <span>大きな丸＝モノ（選ぶと使われている技術が光る）</span>
      <span><svg width="14" height="14"><path d="M7 1L13 7L7 13L1 7Z" fill="none" stroke="#8e5bd6" stroke-width="1.6"/></svg>発見・考え方（実験で見つける）</span>
      <span><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="#888" stroke="#888"/></svg>✅ 作った</span>
      <span><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="none" stroke="#888" stroke-width="1.6"/></svg>❓ まだ</span>
      <span><i class="sw" style="background:#d9d0b0"></i>年の差 小</span>
      <span><i class="sw" style="background:#e8590c"></i>年の差 大</span>
      <span><svg width="18" height="6"><line x1="0" y1="3" x2="18" y2="3" stroke="#888" stroke-dasharray="3 3"/></svg>理解</span>
      <span><svg width="18" height="6"><line x1="0" y1="3" x2="18" y2="3" stroke="#888" stroke-dasharray="7 3"/></svg>発見→技術</span>
    </div>
  </div>
  <aside id="card" aria-live="polite"></aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="tech_network.js"></script>
<script>
(async function () {
  const data = window.TECH_NETWORK || await fetch('tech_network.json').then(r => r.json());
  const nodes = data.nodes, byId = new Map(nodes.map(n => [n.id, n]));
  const isProd = n => n.kind === 'product';
  // 発見・考え方（ideas.md）：ひし形。モノと同じく遠くからでも見える目印
  const isIdea = n => n.kind === 'idea', isLand = n => isProd(n) || isIdea(n);
  const trunks = [...new Set(nodes.filter(n => n.trunk !== 'P' && n.trunk !== 'I').map(n => n.trunk))].sort((a, b) => (a === 'B') - (b === 'B') || (+a) - (+b));
  const trunkName = t => (nodes.find(n => n.trunk === t) || {}).trunk_name || t;
  const palette = ['#8c6d31', '#b5651d', '#2e8b57', '#d1495b', '#e09f3e', '#6a4c93', '#1982c4', '#4f772d', '#7d8597', '#c44569',
                   '#00798c', '#a7c957', '#bc6c25', '#9d4edd', '#3a86ff', '#ff6d00', '#6c757d'];
  // products.md のモノ（P）と ideas.md の発見（I）は幹ではないので決まった色
  const color = t => t === 'P' ? '#c98a00' : t === 'I' ? '#8e5bd6' : palette[trunks.indexOf(t) % palette.length];

  // ---- 横軸：おおまかな年（古い時代は詰め、近代を広げる） ----
  const xs = d3.scaleLinear()
    .domain([-3400000, -100000, -10000, -3000, 0, 1000, 1500, 1700, 1800, 1850, 1900, 1930, 1950, 1970, 1990, 2030])
    .range([0, 50, 120, 200, 260, 320, 380, 470, 580, 690, 820, 930, 1040, 1170, 1300, 1460]).clamp(true);
  const eras = [[-3000000, '300万年前'], [-10000, '1万年前'], [-3000, '前3000'], [0, '0'], [1000, '1000'], [1500, '1500'],
                [1700, '1700'], [1800, '1800'], [1850, '1850'], [1900, '1900'], [1950, '1950'], [1970, '1970'], [2000, '2000']];
  const LEFT = 110, R = n => isProd(n) ? 15 : isIdea(n) ? 12 : 3 + 1.3 * Math.sqrt(n.descendants);

  // ---- 縦：一番上に「モノ」の帯（時代順のランドマーク）、その下に幹ごとの帯。帯の中は力学レイアウトで散らす ----
  // その下に「発見・考え方」の帯
  const bandOf = n => isProd(n) ? 'P' : isIdea(n) ? 'I' : n.trunk;
  const bandKeys = ['P', 'I', ...trunks];
  let y0 = 30; const band = new Map();
  for (const t of bandKeys) {
    const ns = nodes.filter(n => bandOf(n) === t).sort((a, b) => (a.year ?? 0) - (b.year ?? 0));
    const lanes = [];
    for (const n of ns) {
      n.x = n.tx = LEFT + xs(n.year ?? 0); const r = R(n);
      // モノは名前の幅も空ける
      let li = lanes.findIndex(last => n.x - last.x >= (t === 'P' || t === 'I' ? 64 : r + R(last) + 3));
      if (li < 0) { lanes.push(n); li = lanes.length - 1; } else lanes[li] = n;
      n.lane = li;
    }
    const land = t === 'P' || t === 'I', laneH = land ? 44 : 15;
    const h = land ? lanes.length * laneH + 40 : Math.min(220, Math.max(48, lanes.length * 15 + 26));
    ns.forEach(n => { n.y = y0 + 20 + (land ? 10 : 0) + (n.lane % Math.max(1, Math.floor((h - 28) / laneH))) * laneH; });
    band.set(t, { y: y0, h }); y0 += h;
  }
  const sim = d3.forceSimulation(nodes)
    .force('x', d3.forceX(n => n.tx).strength(0.6))
    .force('y', d3.forceY(n => band.get(bandOf(n)).y + band.get(bandOf(n)).h / 2 + 4).strength(n => isLand(n) ? 0.005 : 0.04))
    .force('collide', d3.forceCollide(n => isLand(n) ? 30 : R(n) + 1.5).iterations(3))
    .stop();
  for (let i = 0; i < 260; i++) {
    sim.tick();
    for (const n of nodes) {
      const b = band.get(bandOf(n)), r = isLand(n) ? R(n) : Math.min(R(n), 10);
      n.y = Math.max(b.y + 16 + r, Math.min(b.y + b.h - (isLand(n) ? 16 : 4) - r, n.y));
      n.x = Math.max(LEFT + 4, n.x);
    }
  }
  const W = LEFT + xs.range()[xs.range().length - 1] + 40, H = y0 + 20;

  const svg = d3.select('#svg'), root = svg.append('g');
  const bands = root.append('g');
  bandKeys.forEach((t, i) => {
    const b = band.get(t);
    const land = t === 'P' || t === 'I';
    const g = bands.append('g').attr('class', land ? 'band-prod' : 'band-tech');
    g.append('rect').attr('x', 0).attr('y', b.y).attr('width', W).attr('height', b.h).attr('fill', land ? 'var(--panel)' : i % 2 ? 'var(--band-b)' : 'var(--band-a)');
    if (!land) g.append('text').attr('class', 'band-zoom').attr('x', W / 2).attr('y', b.y + b.h / 2 + 4).attr('text-anchor', 'middle').text('ズームすると技術が見えます');
    g.append('text').attr('class', 'band-label').attr('x', 8).attr('y', b.y + 14).attr('fill', land ? 'var(--ink)' : color(t))
      .text(t === 'P' ? 'モノ（時代順）' : t === 'I' ? '発見・考え方（◆ 実験で見つける）' : `${t === 'B' ? '枝' : '幹' + t} ${trunkName(t)}`);
  });
  const eraG = root.append('g');
  for (const [yr, lab] of eras) {
    const x = LEFT + xs(yr);
    eraG.append('line').attr('class', 'era-line').attr('x1', x).attr('x2', x).attr('y1', 18).attr('y2', H);
    eraG.append('text').attr('class', 'era-label').attr('x', x + 2).attr('y', 14).text(lab);
  }

  // ---- つながりと祖先 ----
  const edges = data.edges.filter(e => byId.has(e.from) && byId.has(e.to)).map(e => {
    const a = byId.get(e.from), b = byId.get(e.to);
    return { ...e, a, b, gap: (b.year ?? 0) - (a.year ?? 0) };
  });
  const parents = new Map(), kids = new Map();
  for (const e of edges) if (e.kind === 'requires' || e.kind === 'enables') {
    (parents.get(e.b.id) || parents.set(e.b.id, []).get(e.b.id)).push(e.a.id);
    (kids.get(e.a.id) || kids.set(e.a.id, []).get(e.a.id)).push(e.b.id);
  }
  const walk = (start, next) => { const seen = new Set(), q = [start]; while (q.length) { const u = q.pop(); for (const v of next.get(u) || []) if (!seen.has(v)) { seen.add(v); q.push(v); } } return seen; };
  const anc = new Map(nodes.map(n => [n.id, walk(n.id, parents)]));
  const desc = id => walk(id, kids);
  // モノとモノのつながり：あるモノの祖先にいるモノのうち、ほかのモノを通らずに届く「すぐ前のモノ」
  const prods = nodes.filter(isProd);
  const plinks = [];
  for (const p of prods) {
    const pa = prods.filter(q => q.id !== p.id && anc.get(p.id).has(q.id));
    for (const q of pa) if (!pa.some(o => o.id !== q.id && anc.get(o.id).has(q.id))) plinks.push({ a: q, b: p });
  }

  // ---- 線 ----
  const gapColor = g => d3.interpolateRgb('#d9d0b0', '#e8590c')(Math.min(1, Math.log10(1 + Math.abs(g)) / 3.3));
  // 線の形：時間軸は横に流れる曲線、ネットワークは直線
  let layoutMode = 'time';
  const curve = (a, b) => { if (layoutMode === 'net') return `M${a.x},${a.y} L${b.x},${b.y}`; const mx = (a.x + b.x) / 2; return `M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`; };
  const TOP = new Set([...edges].filter(e => e.kind === 'requires').sort((p, q) => Math.abs(q.gap) - Math.abs(p.gap)).slice(0, 60));
  const baseOpacity = d => TOP.has(d) ? 0.32 : 0.035;
  const plinkSel = root.append('g').selectAll('path').data(plinks).join('path').attr('class', 'plink').attr('d', d => curve(d.a, d.b));
  const edgeSel = root.append('g').selectAll('path').data(edges).join('path')
    .attr('class', d => 'edge ' + d.kind).attr('d', d => curve(d.a, d.b))
    .attr('stroke', d => gapColor(d.gap)).attr('stroke-opacity', baseOpacity);

  // ---- 点（丸の中に 16×16 のドット絵。無いものは幹の記号・モノの絵文字） ----
  const nodeG = root.append('g');
  const ordered = [...nodes].sort((a, b) => isLand(a) - isLand(b));   // モノを上に描く
  const nodeSel = nodeG.selectAll('g').data(ordered).join('g').attr('class', d => 'node' + (isProd(d) ? ' product' : isIdea(d) ? ' idea' : ''))
    .attr('transform', d => `translate(${d.x},${d.y})`);
  // 形：技術とモノは丸、発見はひし形
  const diamond = r => `M0,${-r * 1.25}L${r * 1.25},0L0,${r * 1.25}L${-r * 1.25},0Z`;
  nodeSel.append(d => document.createElementNS('http://www.w3.org/2000/svg', isIdea(d) ? 'path' : 'circle')).attr('class', 'shape')
    .attr('r', d => isIdea(d) ? null : R(d)).attr('d', d => isIdea(d) ? diamond(R(d)) : null)
    .attr('fill', d => isLand(d) ? null : d.status === '✅' ? color(d.trunk) : 'var(--bg)')
    .attr('stroke', d => isIdea(d) ? '#8e5bd6' : color(d.trunk))
    .attr('stroke-dasharray', d => d.status === '⛔' || d.status === '➖' ? '2 2' : null)
    .append('title').text(d => `[${d.id}] ${d.name}（${yearText(d)}）`);
  nodeSel.filter(d => d.icon).append('image').attr('href', d => d.icon)
    .attr('width', d => R(d) * 1.3).attr('height', d => R(d) * 1.3).attr('x', d => -R(d) * 0.65).attr('y', d => -R(d) * 0.65)
    .attr('opacity', d => !isProd(d) && d.status !== '✅' ? 0.6 : 1);
  nodeSel.filter(d => !d.icon).append('text').attr('class', 'sym')
    .attr('font-size', d => isLand(d) ? (isIdea(d) ? 13 : 17) : Math.max(5, R(d) * 1.05))
    .attr('opacity', d => isLand(d) ? 1 : 0.85)
    .text(d => isProd(d) ? (d.emoji || d.symbol) : isIdea(d) ? (d.emoji || '💡') : d.symbol);
  nodeSel.append('text').attr('class', 'lab')
    .attr('x', d => isLand(d) ? 0 : R(d) + 2).attr('y', d => isLand(d) ? R(d) * (isIdea(d) ? 1.25 : 1) + 12 : 3)
    .text(d => isLand(d) || d.descendants >= 8 ? d.name : '');
  nodeSel.on('click', (ev, d) => { ev.stopPropagation(); select(d.id); });
  svg.on('click', () => select(null));

  const state = { sel: null, q: '', trunk: '', now: false, und: true, all: false };
  // ---- 表示の切り替え：「時間軸」（年と幹の帯）と「ネットワーク」（年を使わず、つながりだけの力学レイアウト。ハブが中央に集まる） ----
  for (const n of nodes) { n.timeX = n.x; n.timeY = n.y; }
  let netReady = false;
  function computeNet() {
    const links = edges.filter(e => e.kind === 'requires' || e.kind === 'enables').map(e => ({ source: e.a, target: e.b }));
    const maxD = d3.max(nodes, n => n.descendants) || 1;
    const sims = nodes.map(n => ({ n, x: n.timeX - W / 2, y: n.timeY - H / 2 }));
    const byN = new Map(sims.map(s => [s.n, s]));
    const L = links.map(l => ({ source: byN.get(l.source), target: byN.get(l.target) }));
    const s = d3.forceSimulation(sims)
      .force('link', d3.forceLink(L).distance(28).strength(0.25))
      .force('charge', d3.forceManyBody().strength(-38))
      // 子孫の多い技術（ハブ）ほど中心へ、少ないものほど外側へ
      .force('radial', d3.forceRadial(d => 60 + 520 * (1 - Math.sqrt(d.n.descendants / maxD)), 0, 0).strength(0.12))
      .force('collide', d3.forceCollide(d => (isLand(d.n) ? 18 : R(d.n)) + 2))
      .stop();
    for (let i = 0; i < 320; i++) s.tick();
    for (const d of sims) { d.n.netX = d.x + W / 2; d.n.netY = d.y + H / 2; }
    netReady = true;
  }
  function applyLayout(mode, animate = true) {
    layoutMode = mode;
    if (mode === 'net' && !netReady) computeNet();
    for (const n of nodes) { n.x = mode === 'net' ? n.netX : n.timeX; n.y = mode === 'net' ? n.netY : n.timeY; }
    const tr = animate ? d3.transition().duration(700) : null;
    const sel = s => tr ? s.transition(tr) : s;
    sel(nodeSel).attr('transform', d => `translate(${d.x},${d.y})` + (isLand(d) ? ` scale(${pinScale()})` : ''));
    sel(edgeSel).attr('d', d => curve(d.a, d.b));
    sel(plinkSel).attr('d', d => curve(d.a, d.b));
    bands.style('display', mode === 'net' ? 'none' : null);
    eraG.style('display', mode === 'net' ? 'none' : null);
    // ネットワークでは帯がないので、点の真ん中が画面の真ん中に来るように合わせ直す
    const b = document.getElementById('chart').getBoundingClientRect();
    const xsN = nodes.map(n => n.x), ysN = nodes.map(n => n.y);
    const [x0, x1, y0b, y1b] = [d3.min(xsN), d3.max(xsN), d3.min(ysN), d3.max(ysN)];
    if (mode === 'net') {
      const k = Math.min(b.width / (x1 - x0 + 80), b.height / (y1b - y0b + 80), 1.2);
      svg.transition().duration(700).call(zoom.transform, d3.zoomIdentity.translate(b.width / 2 - (x0 + x1) / 2 * k, b.height / 2 - (y0b + y1b) / 2 * k).scale(k));
    } else {
      svg.transition().duration(700).call(zoom.transform, d3.zoomIdentity.translate(narrow ? 4 : Math.max(4, (b.width - W * k0) / 2), 4).scale(k0));
    }
  }

  // ---- ズーム：近づくほど細かく（地図アプリのように）。遠いときはモノだけ ----
  let K = 1, DETAIL_K = 1;
  // モノは地図のピンのように、遠くからでも同じくらいの大きさに見せる（倍率の逆数で拡大）
  const pinScale = () => Math.max(1, 0.7 / K);
  const placeProducts = () => nodeSel.filter(isLand).attr('transform', d => `translate(${d.x},${d.y}) scale(${pinScale()})`);
  const zoom = d3.zoom().scaleExtent([0.15, 8]).on('zoom', ev => {
    root.attr('transform', ev.transform);
    const was = detail(); K = ev.transform.k; placeProducts(); if (was !== detail()) render();
  });
  svg.call(zoom);
  const box = document.getElementById('chart').getBoundingClientRect();
  const pb = band.get('P');
  // 最初は「モノ」の帯が収まる倍率。スマホ幅では縮めすぎると読めないので、読める大きさで始めて横にドラッグする
  const narrow = box.width < 700;
  const k0 = narrow ? 0.62 : Math.max(Math.min(box.width / W, (box.height - 10) / (pb.y + pb.h + 10), 1), 0.2);
  DETAIL_K = k0 * 1.8;
  svg.call(zoom.transform, d3.zoomIdentity.translate(narrow ? 4 : Math.max(4, (box.width - W * k0) / 2), 4).scale(k0));

  // ---- 「これが無いと作れなくなる技術」：OR の別ルートも考える ----
  function makeable(without) {
    const ok = new Set(); let grew = true;
    while (grew) {
      grew = false;
      for (const n of nodes) {
        if (ok.has(n.id) || n.id === without) continue;
        if (n.requires.every(alts => alts.some(a => a.every(i => i !== without && (ok.has(i) || !byId.has(i)))))) { ok.add(n.id); grew = true; }
      }
    }
    return ok;
  }
  const ALL = makeable(null);

  // ---- 表示の状態 ----
  function detail() { return state.all || K >= DETAIL_K || !!state.q.trim() || !!state.trunk || state.now; }
  function yearText(d) {
    if (d.year == null) return '年 ?';
    const y = d.year < 0 ? `前${(-d.year).toLocaleString()}年` : `${d.year}年`;
    return y + (d.year_range ? `（${d.year_range}）` : '') + (d.year_uncertain ? ' ⚠️' : '');
  }
  const hay = d => (d.name + ' ' + d.real + ' ' + d.hee1).toLowerCase();
  function matches(d, q) { const id = q.replace(/[\[\]]/g, ''); return d.id.toLowerCase() === id || hay(d).includes(q); }
  function visibleBase(d) {
    if (state.trunk && d.trunk !== state.trunk && !isLand(d)) return false;
    if (state.now && !d.buildable_now) return false;
    return true;
  }
  function render() {
    const det = detail();
    let focus = null, lit = null;
    if (state.sel) {
      const s = byId.get(state.sel);
      lit = anc.get(state.sel);
      focus = isProd(s) ? new Set([state.sel, ...lit]) : new Set([state.sel, ...lit, ...desc(state.sel), ...(s.explains || [])]);
    }
    const q = state.q.trim().toLowerCase();
    // 遠いとき：モノだけ。モノを選ぶと、使われている技術（祖先）が現れて光る
    nodeSel.classed('hidden', d => !isLand(d) && !det && !(focus && focus.has(d.id)))
      .classed('dimmed', d => !visibleBase(d) || (focus && !focus.has(d.id)))
      .classed('lit', d => !!(lit && lit.has(d.id)))
      .classed('match', d => q && matches(d, q))
      .classed('selected', d => d.id === state.sel);
    const shown = d => isLand(d) || det || (focus && focus.has(d.id));
    edgeSel.classed('hidden', d => (d.kind === 'understanding' && !state.und) || !(shown(d.a) && shown(d.b)))
      .classed('dimmed', d => !(visibleBase(d.a) && visibleBase(d.b)))
      .classed('hot', d => state.sel && (d.a.id === state.sel || d.b.id === state.sel))
      .attr('stroke-opacity', d => !focus ? (det ? baseOpacity(d) : 0)
        : (d.a.id === state.sel || d.b.id === state.sel) ? 0.95
        : (focus.has(d.a.id) && focus.has(d.b.id)) ? (det ? 0.3 : 0.45) : 0.015);
    plinkSel.classed('hidden', () => det || !!state.sel);
    // 最初の画面（モノだけ）では、技術の帯を薄くして「ズームすると技術が見えます」と出す
    bands.selectAll('.band-tech').classed('faint', !det && !state.sel);
    bands.selectAll('.band-zoom').classed('hidden', det || !!state.sel);
    const n = nodes.filter(visibleBase).length, hits = q ? nodes.filter(d => matches(d, q)).length : 0;
    document.getElementById('stat').textContent = (q ? `「${state.q.trim()}」${hits} 件・` : '') +
      `モノ ${prods.length}・発見 ${nodes.filter(isIdea).length}・技術 ${nodes.length - prods.length - nodes.filter(isIdea).length}・つながり ${edges.length} 本・年の逆転 ${data.year_inversions.length} 件`;
    document.getElementById('hint').textContent = det ? 'すべての技術を表示中' : 'ズームすると技術が見えます（モノを選んでも）';
  }

  // ---- カード ----
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const chip = id => { const n = byId.get(id); return `<button class="chip" data-id="${id}">${id} ${n ? esc(n.name) : ''}</button>`; };
  // 人物：自作のドット絵の肖像（tools/gen_portraits.py、特徴だけの記号的な絵）＋名前＋ゆかりの道具。肖像がなければシルエット
  const silhouette = `<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="11" r="7" fill="var(--sub)"/><path d="M4 33c0-8 6-13 13-13s13 5 13 13z" fill="var(--sub)"/></svg>`;
  // ---- この技術の裏にいる人たち（NET-04）：自分と祖先に付いている人物（重複なし）を年代順に。node.html と同じ数え方 ----
  const personYear = (p, n) => {
    const s = String(p.year || ''), c = s.match(/(\d+)\s*(?:〜\d+)?\s*世紀/);
    if (c) return (+c[1] - 1) * 100 + 50;
    const m = s.match(/\d+/);
    return m ? (s.includes('前') ? -m[0] : +m[0]) : (n.year ?? 9999);
  };
  const ANON_BEFORE = 1500;   // これより古く、人物の記録がない技術を「名前の残っていない人たち」として数える
  function peopleBehind(id) {
    const seen = new Map(), anon = [];
    for (const i of [id, ...anc.get(id)]) {
      const n = byId.get(i); if (!n) continue;
      if (!n.people.length && n.year != null && n.year < ANON_BEFORE) anon.push(i);
      for (const p of n.people) {
        const o = seen.get(p.name);
        if (o) { if (!o.techs.includes(i)) o.techs.push(i); } else seen.set(p.name, { p, techs: [i], y: personYear(p, n) });
      }
    }
    return { people: [...seen.values()].sort((a, b) => a.y - b.y), anon };
  }
  const crowd = `<svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true"><g fill="var(--sub)" opacity=".55"><circle cx="11" cy="17" r="5"/><path d="M2 40c0-7 4-11 9-11s9 4 9 11z"/><circle cx="37" cy="17" r="5"/><path d="M28 40c0-7 4-11 9-11s9 4 9 11z"/></g><g fill="var(--sub)"><circle cx="24" cy="14" r="6"/><path d="M13 44c0-8 5-13 11-13s11 5 11 13z"/></g></svg>`;
  // 最初は閉じた <details>（数字だけ）。開くと肖像の壁、肖像を押すとその技術へ
  function wallHtml(id) {
    const { people, anon } = peopleBehind(id);
    if (!people.length && !anon.length) return '';
    const tile = (img, name, sub, to, title) => `<button class="wtile" data-id="${to}" title="${esc(title)}">${img}<b>${esc(name)}</b><small>${esc(sub)}</small></button>`;
    const anonTile = anon.length ? tile(crowd, '名前の残っていない、無数の人たち', `${anon.length} の技術`, anon[0], `${ANON_BEFORE}年より前で、発明した人の名前が残っていない技術：` + anon.map(i => byId.get(i).name).join('、')) : '';
    return `<details class="wall sec"><summary>この技術の裏にいる人：<b>${people.length}</b> 人${anon.length ? `＋名前の残っていない人たち` : ''}</summary>
      <div class="wgrid">${anonTile}${people.map(({ p, techs }) => tile(p.portrait ? `<img src="${p.portrait}" alt="">` : silhouette, p.name, techs.map(i => byId.get(i).name).join('・'), techs[0], `${p.name}（${p.year}）`)).join('')}</div></details>`;
  }
  function select(id) {
    state.sel = id; render();
    const card = document.getElementById('card');
    if (!id) { card.classList.remove('open'); card.innerHTML = ''; return; }
    const d = byId.get(id), used = [...anc.get(id)];
    const still = makeable(id), lost = [...ALL].filter(x => x !== id && !still.has(x));
    const req = d.requires.map(alts => alts.map(a => a.map(chip).join(' + ')).join(' <span style="color:var(--sub)">or</span> ')).join('<br>');
    const next = kids.get(id) || [];
    const head = d.icon ? `<img src="${d.icon}" alt="">` : `<span class="em">${esc(isProd(d) ? (d.emoji || d.symbol) : isIdea(d) ? (d.emoji || '💡') : d.symbol)}</span>`;
    const chips = ids => `<div class="chips">${ids.map(chip).join('')}</div>`;
    card.innerHTML = `<button class="close" aria-label="閉じる">×</button>
      <h2>${head}<span>[${d.id}] ${esc(d.name)} ${d.status}</span></h2>
      <a class="more" href="node.html#${encodeURIComponent(d.id)}">詳しく見る →</a>
      <div class="meta"><span style="color:${isIdea(d) ? '#8e5bd6' : color(d.trunk)}">${isIdea(d) ? '◆' : '●'}</span> ${isProd(d) ? '<b>モノ</b>・' : ''}${d.trunk === 'P' || d.trunk === 'I' ? '' : (d.trunk === 'B' ? '枝' : '幹' + d.trunk) + ' '}${esc(d.trunk_name)}・${yearText(d)}${d.buildable_now ? '・<b>今すぐ作れる</b>' : ''}</div>
      ${wallHtml(id)}
      ${d.hee1 ? `<div class="sec"><h3>へえ①</h3>${esc(d.hee1)}</div>` : ''}
      ${d.play ? `<div class="sec"><h3>遊び方</h3>${esc(d.play)}</div>` : ''}
      ${d.enables.length ? `<div class="sec"><h3>この考え方で作れるようになった技術</h3>${chips(d.enables)}</div>` : ''}
      ${d.explains.length ? `<div class="sec"><h3>この考え方が説明する技術</h3>${chips(d.explains)}</div>` : ''}
      ${d.enabled_by.length ? `<div class="sec"><h3>これを作れるようにした考え方</h3>${chips(d.enabled_by)}</div>` : ''}
      ${d.explained_by.length ? `<div class="sec"><h3>なぜ動くかを説明する考え方</h3>${chips(d.explained_by)}</div>` : ''}
      ${d.missing ? `<div class="sec"><h3>足りない技術（ノードを提案中）</h3>${esc(d.missing)}</div>` : ''}
      ${d.people.length ? `<div class="sec"><h3>人物</h3><div class="people">${d.people.map(p => `<div class="person">${p.portrait ? `<img class="portrait" src="${p.portrait}" alt="">` : silhouette}<div><b>${esc(p.name)}</b><small>${esc(p.tool)}・${esc(p.year)}</small></div></div>`).join('')}</div></div>` : ''}
      ${d.real ? `<div class="sec"><h3>本物</h3>${esc(d.real)}</div>` : ''}
      ${isProd(d) ? `<div class="sec"><h3>このモノに使われている技術</h3><div class="big">${used.length}</div><div class="chips">${used.sort().map(chip).join('')}</div></div>` : ''}
      ${isIdea(d) ? '' : `<div class="sec"><h3>これが無いと作れなくなる技術（別ルートも考えたうえで）</h3><div class="big">${lost.length}</div><div class="chips">${lost.map(chip).join('')}</div></div>`}
      <div class="sec"><h3>前提（全部そろう＝AND、or は別ルート）</h3>${req || 'なし'}</div>
      ${d.understanding.length ? `<div class="sec"><h3>理解（後で分かった科学）</h3><div class="chips">${d.understanding.map(chip).join('')}</div></div>` : ''}
      <div class="sec"><h3>すぐ次の技術（${next.length}）</h3><div class="chips">${next.map(chip).join('')}</div></div>`;
    card.classList.add('open');
    card.querySelector('.close').onclick = () => select(null);
    card.querySelectorAll('.wtile').forEach(b => b.onclick = () => { select(b.dataset.id); center(b.dataset.id); });
    card.querySelectorAll('.chip').forEach(b => b.onclick = () => { select(b.dataset.id); center(b.dataset.id); });
  }
  function center(id) {
    const d = byId.get(id), b = document.getElementById('chart').getBoundingClientRect(), t = d3.zoomTransform(svg.node()), k = Math.max(t.k, 1);
    svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(b.width / 2 - d.x * k, b.height / 2 - d.y * k).scale(k));
  }

  // ---- 操作 ----
  const sel = document.getElementById('trunk');
  trunks.forEach(t => sel.insertAdjacentHTML('beforeend', `<option value="${t}">${t === 'B' ? '枝' : '幹' + t} ${trunkName(t)}</option>`));
  sel.onchange = () => { state.trunk = sel.value; render(); };
  document.getElementById('all').onchange = e => { state.all = e.target.checked; render(); };
  document.getElementById('layout').onchange = e => { applyLayout(e.target.value); render(); };
  document.getElementById('now').onchange = e => { state.now = e.target.checked; render(); };
  document.getElementById('und').onchange = e => { state.und = e.target.checked; render(); };
  const qi = document.getElementById('q');
  qi.oninput = () => { state.q = qi.value; render(); };
  qi.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const q = qi.value.trim().toLowerCase().replace(/[\[\]]/g, '');
    const hit = nodes.find(n => n.id.toLowerCase() === q) || nodes.find(n => n.name.toLowerCase().includes(q)) || nodes.find(n => matches(n, q));
    if (hit) { select(hit.id); center(hit.id); }
  };
  const fromHash = () => { const h = decodeURIComponent(location.hash.slice(1)); if (byId.has(h)) { select(h); center(h); } };
  window.addEventListener('hashchange', fromHash);
  render();
  fromHash();
})();
</script>
</body>
</html>
